name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./cmd/hfdesk

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The service mode adds process-global mutable state (the installed
      # runtime path model behind a lock, and the standard logger's output
      # being redirected by the service host), so the race detector must run
      # over the whole suite on the Linux runner.
      - name: Test (race detector)
        run: go test ./... -race

  # The Go jobs never touch the Docker surface. Exercise the real entrypoint
  # image so PUID/PGID, the non-root drop, the --user path, symlink refusal, and
  # argument validation cannot regress silently. The smoke test also takes the
  # per-account coordination carrier lease under a numeric UID that has no NSS
  # entry, which is the configuration the official image runs in.
  docker:
    name: Docker entrypoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint entrypoint syntax
        run: |
          sh -n docker/entrypoint.sh
          sh -n docker/smoke-test.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t hfdesk:ci .

      - name: Smoke-test entrypoint
        run: sh docker/smoke-test.sh hfdesk:ci

  # Exercise native state-file replacement and selected-cache path locality. The full suite
  # has separate pre-existing Windows-compatibility gaps.
  go-windows:
    name: Go checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test native state replacement
        run: go test ./internal/server -run 'Test(WindowsReplaceJobsStateFileUsesNativeReplacement|ReplaceJobsStateFile)' -v

      - name: Test selected-cache path locality
        run: go test ./internal/server -run '^TestCacheSelectionRejectsNonLocalRepoBeforeJoining$' -count=1 -v


      # The Windows desktop host is a second binary of HFDesk. Its defining
      # property is the PE subsystem of the produced file: the console host
      # stays a console subsystem executable and the desktop host is a GUI
      # subsystem executable, so a desktop launch never opens a console
      # window. The subsystem is a build time property, so CI checks it
      # instead of trusting the build script.
      #
      # The desktop host itself is covered by the test of the package below:
      # the notification area host and the Runtime / Logs window are created
      # and reported ready. A machine that cannot host them (no interactive
      # window station, no WebView2 runtime) skips that coverage instead of
      # failing the job.
      - name: Install rsrc
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          echo "$(go env GOPATH)\bin" >> $env:GITHUB_PATH

      - name: Build the Windows artifacts
        env:
          VERSION: ci
          # The target of the step is stated here, so a runner default
          # cannot change it. The desktop artifact is linked with
          # -H=windowsgui, and that flag makes the linker emit a Windows
          # PE image whatever the target is, so an unset or changed GOOS
          # would silently produce a PE binary where a host binary was
          # intended.
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go run ./cmd/hfdesk/genico.go
          rsrc -ico cmd/hfdesk/hfdesk.ico -o cmd/hfdesk/resource_windows_amd64.syso
          rsrc -ico cmd/hfdesk/hfdesk.ico -o cmd/hfdesk-desktop/resource_windows_amd64.syso
          go build -ldflags "-s -w -X main.Version=$env:VERSION" -o hfdesk_windows_amd64_ci.exe ./cmd/hfdesk
          go build -ldflags "-s -w -X main.Version=$env:VERSION -H=windowsgui" -o hfdesk-desktop_windows_amd64_ci.exe ./cmd/hfdesk-desktop

      - name: Check the PE subsystem of the Windows artifacts
        run: |
          go run .github/scripts/pesubsystem.go hfdesk_windows_amd64_ci.exe 3
          go run .github/scripts/pesubsystem.go hfdesk-desktop_windows_amd64_ci.exe 2

      - name: Cleanup Windows resources
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue cmd/hfdesk/resource_windows_amd64.syso, cmd/hfdesk/hfdesk.ico, cmd/hfdesk-desktop/resource_windows_amd64.syso

      # The desktop host: the single instance lock, the server lifecycle, the
      # notification area host and the Runtime / Logs window. The last two
      # skip themselves on a machine that cannot host them.
      - name: Test the desktop host lifecycle
        run: go test ./internal/desktop -count=1 -v

      # The service tests skip cleanly when the runner is not elevated, so the
      # SCM registration itself is only exercised where the runner allows it.
      - name: Test service package
        run: go test ./internal/service -v

      # The command layer is platform independent, so it is exercised on
      # Windows too: a check of the command line that only holds on Unix
      # would otherwise stay unnoticed until a Windows installation.
      - name: Test command layer
        run: go test ./cmd/hfdesk -v

      - name: Test rebuild leases and native CLI coordination
        run: go test ./pkg/hfdownloader -run '^Test(RebuildCoordinationLeaseProcessExitAndStableObject|RebuildCoordinationRefusesForeignCarrierRecord|RebuildCoordinationDoesNotAdoptUnownedDirectoryCandidate|RebuildCoordinationTreePreflightProtectsOwnedCoordinator|RebuildCoordinationPathIgnoresPerProcessCacheOverride|SameUIDDifferentEnvironmentChildSharesExclusiveRootLease|RebuildCoordinationConcurrentBootstrapAcrossProcesses|FirstBranchClaimWaitsForCrossProcessOrdinaryAdmission|SyncCleanKeepsStableRootLeaseObject|SyncCleanRefusesToRemoveOwnedCoordinationScope|SyncCleanLeavesProfileCoordinatorOutsideCacheScope|OrdinaryDownloadCannotReplaceOwnedCoordinationCarrier|OrdinaryHFWriterPreservesNestedCoordinationCarrier|OrdinaryLocalWriterUsesUnownedServiceOwnerSpelling|OrdinaryWriteWinsBeforeFirstBranchServiceClaim|FirstBranchServiceClaimWinsBeforeOrdinaryWriter|OrdinaryHFDownloadIgnoresUnownedRootServiceCandidateAndClaimRefuses|RebuildCoordinationLeavesLegacyRootSidecarUnclaimed|BranchVariantMutationGuardDistinguishesEntryFromReferent|BranchVariantPartialCleanupKeepsOwnershipAndCompletion|WindowsGoCLIRebuildWaitsForAppDownloadAcrossRootAlias|OrdinaryDownloadsIgnoreUnmarkedServiceCandidateRoot|CopiedLocalRootKeepsCompleteArtifactWithIncompleteSibling|UnverifiableServiceCandidateFailsClosedForIntersectingWrites)$' -count=1 -v

      - name: Test server proof mutators
        run: go test ./internal/server -run '^Test(CopiedLocalRootRebindSurvivesFailedSecondArtifact|SameUIDDifferentHomeCLIWaitsForOrdinaryAPIDownload|CopiedHFAndLocalRootsRetainBranchPresence|FailedTrustedSHAStableRetryRevokesOldPresenceProof|CacheDeleteRefusesNestedForeignBranchServiceBeforeAnyRemoval|CopiedLocalRootPresenceSurvivesIncompleteSiblingArtifact)$' -count=1 -v

  # The launchd manager and the property list rendering are darwin-only code,
  # so they need a macOS runner. The run executes the plist validation
  # (plutil -lint) and the launchctl integration cycle where the runner
  # allows it.
  #
  # The repository has never run its full suite on macOS, so the job covers
  # the darwin-only code only: the launchd manager, the property list
  # rendering, the plutil validation and the launchctl lifecycle. Widening
  # it to the full suite is a separate, deliberate step.
  go-macos:
    name: Go checks (macOS)
    runs-on: macos-latest
    # A macOS runner is slow and a stalled lifecycle test would occupy it
    # until the default limit of the platform. The limit is comfortably
    # above the duration of the job.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...


      # The service package covers the launchd manager, the plutil -lint
      # validation of the generated property list and the launchctl
      # lifecycle where the runner allows it.
      - name: Test service package
        run: go test ./internal/service -v


      # The command layer is platform independent, so it is exercised on
      # macOS too: a check of the command line that only holds on another
      # platform would otherwise stay unnoticed until a macOS installation.
      - name: Test command layer
        run: go test ./cmd/hfdesk -v

      - name: Test rebuild leases, CLI coordination, and wrapper
        run: go test ./pkg/hfdownloader -run '^Test(RebuildCoordinationLeaseProcessExitAndStableObject|RebuildCoordinationRefusesForeignCarrierRecord|RebuildCoordinationDoesNotAdoptUnownedDirectoryCandidate|RebuildCoordinationTreePreflightProtectsOwnedCoordinator|RebuildCoordinationPathIgnoresPerProcessCacheOverride|SameUIDDifferentEnvironmentChildSharesExclusiveRootLease|RebuildCoordinationConcurrentBootstrapAcrossProcesses|FirstBranchClaimWaitsForCrossProcessOrdinaryAdmission|SyncCleanKeepsStableRootLeaseObject|SyncCleanRefusesToRemoveOwnedCoordinationScope|SyncCleanLeavesProfileCoordinatorOutsideCacheScope|OrdinaryDownloadCannotReplaceOwnedCoordinationCarrier|OrdinaryHFWriterPreservesNestedCoordinationCarrier|OrdinaryLocalWriterUsesUnownedServiceOwnerSpelling|OrdinaryWriteWinsBeforeFirstBranchServiceClaim|FirstBranchServiceClaimWinsBeforeOrdinaryWriter|OrdinaryHFDownloadIgnoresUnownedRootServiceCandidateAndClaimRefuses|RebuildCoordinationLeavesLegacyRootSidecarUnclaimed|BranchVariantMutationGuardDistinguishesEntryFromReferent|BranchVariantPartialCleanupKeepsOwnershipAndCompletion|GoCLIRebuildWaitsForAppDownloadAcrossRootAlias|RebuildWrapperUsesGoWithoutPythonAndForwardsCleanVerbose|RebuildWrapperFailsClosedWithoutCompatibleBinary)$' -count=1 -v

      - name: Test server proof mutators
        run: go test ./internal/server -run '^Test(CopiedLocalRootRebindSurvivesFailedSecondArtifact|SameUIDDifferentHomeCLIWaitsForOrdinaryAPIDownload|CopiedHFAndLocalRootsRetainBranchPresence|CopiedLocalRootPresenceSurvivesIncompleteSiblingArtifact|FailedTrustedSHAStableRetryRevokesOldPresenceProof|CacheDeleteRefusesNestedForeignBranchServiceBeforeAnyRemoval)$' -count=1 -v
