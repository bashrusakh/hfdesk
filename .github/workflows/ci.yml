name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build ./cmd/hfdesk

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The Go jobs never touch the Docker surface. Exercise the real entrypoint
  # image so PUID/PGID, the non-root drop, the --user path, symlink refusal, and
  # argument validation cannot regress silently.
  docker:
    name: Docker entrypoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint entrypoint syntax
        run: |
          sh -n docker/entrypoint.sh
          sh -n docker/smoke-test.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t hfdesk:ci .

      - name: Smoke-test entrypoint
        run: sh docker/smoke-test.sh hfdesk:ci

  # Exercise the native state-file replacement path added here. The full suite
  # has separate pre-existing Windows-compatibility gaps.
  go-windows:
    name: Go checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test native state replacement
        run: go test ./internal/server -run 'Test(WindowsReplaceJobsStateFileUsesNativeReplacement|ReplaceJobsStateFile)' -v

      - name: Test native storage ownership
        run: go test ./pkg/hfdownloader -run '^(TestManagedRoot|TestRepoPhysicalCopies|TestWholeCopy)' -count=1 -v

      - name: Test native server root ownership
        run: go test ./internal/server -run '^(Test(ManagedRoot.*|ConfiguredPathIdentity|CaseDistinctRouteDestinations|LocalCacheRoots.*|API_CacheHFFriendlyMetadata_(Ownership|NoProjection)|API_CacheDelete_PathTraversal|WholeHubDelete.*|ExactHubConsumersAndConfinement|ManifestAssociationUsesPhysicalEvidenceOnly))$' -count=1 -v
