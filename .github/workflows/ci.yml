name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Verify formatting
        run: |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then
        echo "The following Go files are not gofmt-formatted:"
        echo "$files"
        exit 1
      fi

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/hfdesk

