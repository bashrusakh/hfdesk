name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./cmd/hfdesk

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The Go jobs never touch the Docker surface. Exercise the real entrypoint
  # image so PUID/PGID, the non-root drop, the --user path, symlink refusal, and
  # argument validation cannot regress silently.
  docker:
    name: Docker entrypoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint entrypoint syntax
        run: |
          sh -n docker/entrypoint.sh
          sh -n docker/smoke-test.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t hfdesk:ci .

      - name: Smoke-test entrypoint
        run: sh docker/smoke-test.sh hfdesk:ci

  # Exercise native state-file replacement and selected-cache path locality. The full suite
  # has separate pre-existing Windows-compatibility gaps.
  go-windows:
    name: Go checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test native state replacement
        run: go test ./internal/server -run 'Test(WindowsReplaceJobsStateFileUsesNativeReplacement|ReplaceJobsStateFile)' -v

      - name: Test selected-cache path locality
        run: go test ./internal/server -run '^TestCacheSelectionRejectsNonLocalRepoBeforeJoining$' -count=1 -v

      - name: Test rebuild leases and native CLI coordination
        run: go test ./pkg/hfdownloader -run '^Test('^Test(RebuildCoordinationLeaseProcessExitAndStableObject|RebuildCoordinationRefusesForeignCarrierRecord|RebuildCoordinationDoesNotAdoptUnownedDirectoryCandidate|RebuildCoordinationTreePreflightProtectsOwnedCoordinator|RebuildCoordinationPathIgnoresPerProcessCacheOverride|SameUIDDifferentEnvironmentChildSharesExclusiveRootLease|RebuildCoordinationConcurrentBootstrapAcrossProcesses|FirstBranchClaimWaitsForCrossProcessOrdinaryAdmission|SyncCleanKeepsStableRootLeaseObject|SyncCleanRefusesToRemoveOwnedCoordinationScope|SyncCleanLeavesProfileCoordinatorOutsideCacheScope|OrdinaryDownloadCannotReplaceOwnedCoordinationCarrier|OrdinaryHFWriterPreservesNestedCoordinationCarrier|OrdinaryLocalWriterUsesUnownedServiceOwnerSpelling|OrdinaryWriteWinsBeforeFirstBranchServiceClaim|FirstBranchServiceClaimWinsBeforeOrdinaryWriter|OrdinaryHFDownloadIgnoresUnownedRootServiceCandidateAndClaimRefuses|RebuildCoordinationLeavesLegacyRootSidecarUnclaimed|BranchVariantMutationGuardDistinguishesEntryFromReferent|BranchVariantPartialCleanupKeepsOwnershipAndCompletion|WindowsGoCLIRebuildWaitsForAppDownloadAcrossRootAlias|OrdinaryDownloadsIgnoreUnmarkedServiceCandidateRoot|CopiedLocalRootKeepsCompleteArtifactWithIncompleteSibling|UnverifiableServiceCandidateFailsClosedForIntersectingWrites)$')$' -count=1 -v

      - name: Test rebuild probe and CLI entrypoint
        run: go test ./cmd/hfdesk -count=1 -v

      - name: Test server proof mutators
        run: go test ./internal/server -run '^Test('^Test(CopiedLocalRootRebindSurvivesFailedSecondArtifact|SameUIDDifferentHomeCLIWaitsForOrdinaryAPIDownload|CopiedHFAndLocalRootsRetainBranchPresence|FailedTrustedSHAStableRetryRevokesOldPresenceProof|CacheDeleteRefusesNestedForeignBranchServiceBeforeAnyRemoval|CopiedLocalRootPresenceSurvivesIncompleteSiblingArtifact)$')$' -count=1 -v

  go-macos:
    name: Go checks (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Test rebuild leases, CLI coordination, and wrapper
        run: go test ./pkg/hfdownloader -run '^Test(RebuildCoordinationLeaseProcessExitAndStableObject|RebuildCoordinationRefusesForeignCarrierRecord|RebuildCoordinationDoesNotAdoptUnownedDirectoryCandidate|RebuildCoordinationTreePreflightProtectsOwnedCoordinator|RebuildCoordinationPathIgnoresPerProcessCacheOverride|SameUIDDifferentEnvironmentChildSharesExclusiveRootLease|RebuildCoordinationConcurrentBootstrapAcrossProcesses|FirstBranchClaimWaitsForCrossProcessOrdinaryAdmission|SyncCleanKeepsStableRootLeaseObject|SyncCleanRefusesToRemoveOwnedCoordinationScope|SyncCleanLeavesProfileCoordinatorOutsideCacheScope|OrdinaryDownloadCannotReplaceOwnedCoordinationCarrier|OrdinaryHFWriterPreservesNestedCoordinationCarrier|OrdinaryLocalWriterUsesUnownedServiceOwnerSpelling|OrdinaryWriteWinsBeforeFirstBranchServiceClaim|FirstBranchServiceClaimWinsBeforeOrdinaryWriter|OrdinaryHFDownloadIgnoresUnownedRootServiceCandidateAndClaimRefuses|RebuildCoordinationLeavesLegacyRootSidecarUnclaimed|BranchVariantMutationGuardDistinguishesEntryFromReferent|BranchVariantPartialCleanupKeepsOwnershipAndCompletion|GoCLIRebuildWaitsForAppDownloadAcrossRootAlias|RebuildWrapperUsesGoWithoutPythonAndForwardsCleanVerbose|RebuildWrapperFailsClosedWithoutCompatibleBinary)$' -count=1 -v

      - name: Test rebuild probe and CLI entrypoint
        run: go test ./cmd/hfdesk -count=1 -v

      - name: Test server proof mutators
        run: go test ./internal/server -run '^Test(CopiedLocalRootRebindSurvivesFailedSecondArtifact|SameUIDDifferentHomeCLIWaitsForOrdinaryAPIDownload|CopiedHFAndLocalRootsRetainBranchPresence|FailedTrustedSHAStableRetryRevokesOldPresenceProof|CacheDeleteRefusesNestedForeignBranchServiceBeforeAnyRemoval)$' -count=1 -v
