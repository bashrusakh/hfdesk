name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build ./cmd/hfdesk

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Bind-mount namespace cases cannot silently become a green skip. Keep the
  # fixture inside a private mount namespace and require the tests themselves
  # to confirm native mounts were created and exercised.
  go-native-mounts:
    name: Go checks (native Linux mounts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Verify required native mount test selection
        shell: bash
        run: |
          set -euo pipefail
          selected="$(go test ./pkg/hfdownloader ./internal/server -list '^TestNativeMount')"
          printf '%s\n' "$selected"
          if ! grep -Eq '^TestNativeMount[^[:space:]]*$' <<<"$selected"; then
            echo 'No TestNativeMount* tests were selected; refusing an empty green job.' >&2
            exit 1
          fi

      - name: Run required native mount cases in a private namespace
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/hfdesk-native-mounts.XXXXXX")"
          go_bin="$(command -v go)"
          go_version="$("$go_bin" version)"
          printf 'Configured toolchain: %s (%s)\n' "$go_bin" "$go_version"
          if ! grep -Eq ' go1\.24([.[:space:]]|$)' <<<"$go_version"; then
            echo 'Expected the setup-go Go 1.24 toolchain; refusing another Go version.' >&2
            exit 1
          fi
          cleanup() { sudo rm -rf -- "$scratch"; }
          trap cleanup EXIT
          mkdir -p "$scratch/home" "$scratch/config" "$scratch/cache" "$scratch/gocache" "$scratch/tmp"
          if ! sudo unshare --mount --propagation private -- true; then
            echo 'Runner cannot create a private mount namespace; native mount proof is required.' >&2
            exit 1
          fi
          sudo unshare --mount --propagation private -- \
            env HOME="$scratch/home" XDG_CONFIG_HOME="$scratch/config" \
            HF_HOME="$scratch/cache" GOCACHE="$scratch/gocache" TMPDIR="$scratch/tmp" \
            GO_BIN="$go_bin" GOTOOLCHAIN=local \
            HFDESK_REQUIRE_NATIVE_MOUNTS=1 \
            bash -euo pipefail -c 'version="$("$GO_BIN" version)"; printf "In namespace: %s (%s)\n" "$GO_BIN" "$version"; grep -Eq " go1\.24([.[:space:]]|$)" <<<"$version"; "$GO_BIN" test ./pkg/hfdownloader ./internal/server -run "^TestNativeMount" -count=1 -v'

  # The Go jobs never touch the Docker surface. Exercise the real entrypoint
  # image so PUID/PGID, the non-root drop, the --user path, symlink refusal, and
  # argument validation cannot regress silently.
  docker:
    name: Docker entrypoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint entrypoint syntax
        run: |
          sh -n docker/entrypoint.sh
          sh -n docker/smoke-test.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t hfdesk:ci .

      - name: Smoke-test entrypoint
        run: sh docker/smoke-test.sh hfdesk:ci

  # Exercise the native state-file replacement path added here. The full suite
  # has separate pre-existing Windows-compatibility gaps.
  go-windows:
    name: Go checks (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test native state replacement
        run: go test ./internal/server -run 'Test(WindowsReplaceJobsStateFileUsesNativeReplacement|ReplaceJobsStateFile)' -v

      - name: Test native storage ownership
        run: go test ./pkg/hfdownloader -run '^(TestManagedRoot|TestRepoPhysicalCopies|TestWholeCopy)' -count=1 -v

      - name: Test native server root ownership
        run: go test ./internal/server -run '^(Test(ManagedRoot.*|ConfiguredPathIdentity|CacheAndRoutePathsUseCapturedConfigBase|FindLocalCachedRepoPreservesFriendlySourcePriority|CaseDistinctRouteDestinations|LocalCacheRoots.*|LocalCachedRepos_(RootRestrictions|NestedRoots)|API_CacheHFFriendlyMetadata_(Ownership|NoProjection|ConfigSnapshot)|API_CacheDelete_(PathTraversal|ValidRepoFormat|ProtectsNestedFriendlyRootsBeforeEitherRemoval|ProtectsInverseAliasNestedInHubBeforeRemoval|RefusesAliasedFriendlyComponentsBeforeHubRemoval|ModelNameMayContainDatasetPrefix)|WholeHubDelete.*|ExactHubConsumersAndConfinement|ManifestAssociationUsesPhysicalEvidenceOnly|JobDestFreeze_.*|CreateJob_DedupDestinationIdentity.*))$' -count=1 -v
