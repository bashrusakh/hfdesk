name: Build dev

# Builds a test binary for every pushed branch (not just main) so a change
# can be smoke-tested from the workflow-run artifact before merging. A
# pull_request trigger is deliberately omitted: branches live in this repo,
# so it would only duplicate the push run.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@v0.10.2

      - name: Generate Windows icon resource
        run: |
          go run ./cmd/hfdesk/genico.go
          rsrc -ico cmd/hfdesk/hfdesk.ico -o cmd/hfdesk/resource_windows_amd64.syso

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          go build -ldflags="-X main.Version=${VERSION}" \
            -trimpath \
            -o hfdesk_windows_amd64_${VERSION}.exe \
            ./cmd/hfdesk

      - name: Cleanup Windows resources
        run: |
          rm -f cmd/hfdesk/resource_windows_amd64.syso cmd/hfdesk/hfdesk.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hfdesk-windows-amd64
          path: hfdesk_windows_amd64_*.exe
          retention-days: 7
