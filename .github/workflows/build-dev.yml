name: Build dev

on:
  push:
    branches: [master]

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          go build -ldflags="-X main.Version=${VERSION}" \
            -trimpath \
            -o hfdesk_windows_amd64_${VERSION}.exe \
            ./cmd/hfdesk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hfdesk-windows-amd64
          path: hfdesk_windows_amd64_*.exe
          retention-days: 7
