name: PR Metadata Triage

# Thin caller shim for the reusable triage master in bashrusakh/.github, pinned at
# e7add3fbe795d151702f9e13740bf9786aba5a84.
# The contract is read from THIS repository's PR base branch, never from the PR head (or from
# the default branch when the event carries no pull request): the master fetches the
# contract_files below from the resolved head and fails closed before the agent starts when a
# listed file is missing.
# The permissions are the union the called workflow's jobs require; issues:write and
# pull-requests:write are the write scopes (actions:read/contents:read cover the rest).
# Inert until merged: pull_request_target runs only workflows that exist on the default branch.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Informational pull request number for a manual run."
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    uses: bashrusakh/.github/.github/workflows/triage-pr.lock.yml@e7add3fbe795d151702f9e13740bf9786aba5a84
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    with:
      contract_files: ".github/triage-policy.md AGENTS.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md"
      pr_number: ${{ github.event.inputs.pr_number }}
