name: Backlog Re-triage

# Thin caller shim for the reusable triage master in bashrusakh/.github, pinned at
# e7add3fbe795d151702f9e13740bf9786aba5a84.
# The contract is read from THIS repository, never from the master: the master resolves this
# repository's default-branch head, fetches the contract_files below from it, and fails
# closed before the agent starts when a listed file is missing.
# The permissions are the union the called workflow's jobs require; issues:write and
# pull-requests:write are the write scopes (actions:read/contents:read cover the rest).
# Inert until merged: scheduled workflows only run from the default branch.
on:
  schedule:
    # Weekly, at the stable per-repository slot previously derived for this repository's
    # backlog workflow.
    - cron: "20 3 * * 4"
  workflow_dispatch:
    inputs:
      item_numbers:
        description: "Informational comma-separated issue/PR numbers for a manual run, at most 10."
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    uses: bashrusakh/.github/.github/workflows/triage-backlog.lock.yml@e7add3fbe795d151702f9e13740bf9786aba5a84
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    with:
      contract_files: ".github/triage-policy.md AGENTS.md CONTRIBUTING.md .github/ISSUE_TEMPLATE/bug_report.yml .github/PULL_REQUEST_TEMPLATE.md .github/labels.yml"
      item_numbers: ${{ github.event.inputs.item_numbers }}
