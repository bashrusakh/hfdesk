name: Issue and PR Compliance
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      item_number:
        description: Issue or PR number
        required: true
        type: string
      item_kind:
        description: 'issue or pull_request'
        type: string
        default: 'issue'
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  compliance:
    uses: bashrusakh/.github/.github/workflows/compliance.lock.yml@7b665576f73b74a82dff45bee0dedf5566381a23
    with:
      item_number: ${{ inputs.item_number || github.event.issue.number || github.event.pull_request.number }}
      item_kind: ${{ inputs.item_kind || (github.event_name == 'issues' && 'issue' || 'pull_request') }}
      contract_files: "CONTRIBUTING.md AGENTS.md"
    secrets:
      TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
