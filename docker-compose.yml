# Example docker-compose.yml for HFDesk.
#
# All writable state lives under the single /data volume. Set PUID/PGID to
# your host user so downloaded models are owned by you (find them with
# `id -u` / `id -g`).
#
# For private/gated models, pass a Hugging Face token with the `--token` flag
# or set it in the HFDesk settings UI/API; the binary does not read an
# HF_TOKEN environment variable. That state persists under /data/.config.
services:
  hfdesk:
    image: ghcr.io/bashrusakh/hfdesk:latest
    container_name: hfdesk
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
    volumes:
      - ./hfdesk-data:/data
    restart: unless-stopped
