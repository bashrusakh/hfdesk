<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFDesk &mdash; Logs</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/runtime.css">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
  <div class="runtime-shell">

    <header class="runtime-header">
      <div class="logo">
        <img class="logo-icon" src="icon.svg" alt="" aria-hidden="true">
        <span class="logo-text">HFDesk</span>
      </div>

      <div class="runtime-header-status">
        <span class="connection-status">
          <span class="status-indicator" id="statusDot"></span>
          <span id="statusLabel">Starting&hellip;</span>
        </span>
        <span class="runtime-version" id="versionLabel">Version &mdash;</span>

        <!-- The service control: one trigger over the actions of the
             registration. The menu is part of this markup - never built by
             the script - so the fallback document of the window host can
             render the same control. A document that owns none of the
             actions shows the chip instead of a dead menu. -->
        <div class="runtime-service" id="serviceControl" hidden>
          <button class="btn btn-outline btn-sm runtime-service-trigger" id="serviceTrigger" type="button"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="serviceMenu"
                  title="The service registration of this machine">
            <span class="status-indicator runtime-service-dot is-muted" id="serviceDot"></span>
            <span class="runtime-service-label" id="serviceLabel">Service &mdash;</span>
            <svg class="runtime-service-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12" aria-hidden="true">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
          <div class="runtime-service-menu" id="serviceMenu" role="menu" aria-labelledby="serviceTrigger" hidden>
            <button class="runtime-service-item" id="serviceInstallItem" type="button" role="menuitem" data-service-action="install" hidden>Install service&hellip;</button>
            <button class="runtime-service-item" id="serviceStartItem" type="button" role="menuitem" data-service-action="start" hidden>Start service</button>
            <button class="runtime-service-item" id="serviceStopItem" type="button" role="menuitem" data-service-action="stop" hidden>Stop service</button>
            <button class="runtime-service-item" id="serviceUpdateItem" type="button" role="menuitem" data-service-action="update" hidden>Update service</button>
            <div class="runtime-service-separator" id="serviceSeparator" role="separator" hidden></div>
            <button class="runtime-service-item runtime-service-item-danger" id="serviceDeleteItem" type="button" role="menuitem" data-service-action="delete" hidden>Delete service&hellip;</button>
          </div>
          <span class="badge badge-secondary runtime-service-chip" id="serviceChip" hidden>
            <span class="status-indicator runtime-service-dot is-muted" id="serviceChipDot"></span>
            <span id="serviceChipLabel">Service &mdash;</span>
          </span>
        </div>
      </div>

      <div class="runtime-header-actions">
        <span class="runtime-note" id="openUiNote" hidden></span>
        <button class="btn btn-primary btn-sm" id="openUiButton" type="button">Open HFDesk</button>
      </div>
    </header>

    <div class="runtime-error" id="errorBanner" role="status" hidden>
      <strong id="errorTitle">Cannot reach the HFDesk server</strong>
      <span id="errorText"></span>
    </div>

    <section class="runtime-strip" aria-label="Runtime status">
      <div class="runtime-stat">
        <span class="runtime-stat-label">Server</span>
        <span class="runtime-stat-value"><code class="runtime-url" id="serverUrl">&mdash;</code></span>
      </div>
      <div class="runtime-stat">
        <span class="runtime-stat-label">Active jobs</span>
        <span class="runtime-stat-value">
          <span id="activeJobs">&mdash;</span>
          <span class="badge badge-warning" id="queuedJobs" hidden>0 queued</span>
        </span>
      </div>
      <div class="runtime-stat">
        <span class="runtime-stat-label">Log file</span>
        <span class="runtime-stat-value">
          <span class="config-chip"><code id="logFile">&mdash;</code></span>
        </span>
      </div>
    </section>

    <section class="runtime-log-panel">
      <div class="runtime-log-toolbar">
        <div class="runtime-toolbar-group">
          <label class="runtime-toolbar-label" for="levelFilter">Level</label>
          <select class="search-select" id="levelFilter">
            <option value="all">All levels</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
          <div class="search-input-wrap runtime-search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input class="search-input" id="searchInput" type="text" placeholder="Search logs&hellip;" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div class="runtime-toolbar-group">
          <label class="checkbox-label checkbox-label-sm" for="followToggle">
            <input type="checkbox" id="followToggle" checked>
            <span>Follow</span>
          </label>
          <button class="btn btn-secondary btn-sm" id="copyButton" type="button"
                  title="Copy the rows that are currently visible to the clipboard">Copy</button>
          <button class="btn btn-outline btn-sm" id="clearButton" type="button"
                  title="Clear the rows shown in this window. Nothing is deleted on disk and the server log is not affected.">Clear view</button>
          <button class="btn btn-secondary btn-sm" id="openLogsButton" type="button"
                  title="Open the folder of the active log file" disabled>Open log folder</button>
          <button class="btn btn-secondary btn-sm" id="openLogFileButton" type="button"
                  title="Open the active log file in the default program" disabled>Open the log file</button>
        </div>
      </div>

      <div class="runtime-log-meta">
        <span class="connection-status">
          <span class="status-indicator" id="streamDot"></span>
          <span id="streamLabel">Connecting&hellip;</span>
        </span>
        <span id="recordCount">0 records</span>
      </div>

      <div class="runtime-log-view" id="logView" role="log" aria-live="off" tabindex="0">
        <div class="runtime-log-head" aria-hidden="true">
          <span class="runtime-time">Time</span>
          <span class="runtime-level">Level</span>
          <span class="runtime-component">Component</span>
          <span class="runtime-message">Message</span>
          <span class="runtime-attrs">Attributes</span>
        </div>
        <div class="runtime-log-body" id="logBody"></div>
        <div class="empty-state" id="emptyState" hidden>
          <h3 id="emptyTitle">No log records yet</h3>
          <p id="emptyText">The runtime log appears here as the server writes it.</p>
        </div>
      </div>
    </section>

  </div>

  <div class="runtime-live-region" id="liveRegion" role="status" aria-live="polite"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/logview.js"></script>
  <script src="js/servicecontrol.js"></script>
  <script src="js/runtime.js"></script>
</body>
</html>
